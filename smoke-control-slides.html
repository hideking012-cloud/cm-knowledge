<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>排煙｜煙はどこへ行く？ — CM知識一覧</title>
  <style>
    :root{color-scheme:dark;--bg:#0c1820;--ink:#152f42;--warm:#fff3d9;--teal:#a0e3ce;--line:#304853}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#eef7f7;font:16px/1.5 "Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif}
    [hidden]{display:none!important}
    a{color:inherit;text-underline-offset:.22em}
    button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid #ffe0a4;outline-offset:3px}
    .app{height:100vh;height:100dvh;max-width:1720px;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:0 clamp(8px,2vw,32px);gap:clamp(6px,1.2vh,14px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-width:0;padding:.62rem 0 .3rem;font-size:clamp(.78rem,1.6vw,1rem)}
    .topbar a{color:#afc9cf}.topbar strong{color:var(--teal)}
    .stage-space{min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
    .stage{width:min(100%,1400px);width:min(100cqw,177.777777cqh,1400px);aspect-ratio:16/9;position:relative;container-type:inline-size;overflow:hidden;border-radius:clamp(6px,1.5vw,18px);background:#142632}
    .slide{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.55cqw;padding:3.6cqw 4.3cqw;color:var(--ink);background:var(--warm)}
    .slide-title{margin:0;font-size:5.5cqw;font-weight:800;line-height:1.12;letter-spacing:-.035em}
    .topic{display:block;margin:0 0 .7cqw;color:#276c65;font-size:2cqw;font-weight:800;letter-spacing:.07em}
    .figure{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;margin:0}
    .figure canvas{display:block;width:100%;height:100%;min-height:0;object-fit:contain}
    .figure figcaption{font-size:2.4cqw;line-height:1.23;text-align:center;font-weight:700;color:#3d5964;padding:.55cqw .2cqw 0}
    .cover{grid-template-columns:43% minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:center;background:#142934;color:#fff4de;gap:2cqw}
    .cover .topic{color:var(--teal);font-size:2.3cqw;margin-bottom:1.6cqw}
    .cover h1{font-size:7.65cqw;font-weight:850;line-height:1.08;letter-spacing:-.055em;margin:0}
    .cover .intro{font-size:3cqw;color:#c0e3d8;font-weight:700;margin:2.1cqw 0 0}
    .cover .figure{height:89%}
    .cover canvas{border-radius:1.65cqw;background:#fcf0d6}
    .cover figcaption{color:#b8d3d4;font-size:2cqw}
    .phase-3{background:#fdf1df}.phase-4{background:#e9f4ed}.check{background:#e9f0ed}
    .check-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2.5cqw;min-height:0}
    .check-layout .figure{grid-template-rows:minmax(0,1fr)}
    .route-list{list-style:none;margin:0;padding:0;display:grid;gap:.75cqw;align-content:center}
    .route-list li{display:flex;align-items:center;gap:1cqw;padding:.8cqw 1.1cqw;border:1px solid #b9cec4;border-radius:1cqw;background:#fcf7e6;font-size:2.65cqw;font-weight:800;line-height:1.2}
    .route-list strong{display:grid;flex:0 0 2.6cqw;height:2.6cqw;place-items:center;color:#25384a;background:#ffcd79;border-radius:50%;font-size:1.7cqw}
    .video-slide{padding:0;display:block;background:#0a1118}
    .video-slide video{display:block;width:100%;height:100%;object-fit:contain;background:#0a1118}
    .pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(4px,1vw,14px);padding:.3rem 0 .66rem;font-size:clamp(.75rem,1.5vw,1rem)}
    .pager .position{color:#bdcdd1;font-variant-numeric:tabular-nums;justify-self:start}
    .pager .step-buttons,.pager .actions{display:flex;align-items:center;gap:clamp(4px,.8vw,10px)}
    .pager .actions{justify-self:end}
    .pager button{min-height:36px;padding:.3em .62em;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:#172b35}
    .pager button:hover{background:#244250}.pager button:disabled{opacity:.44;cursor:default}
    .pager #next{background:var(--teal);color:#112a31;border-color:transparent;font-weight:750}
    .pager #next:disabled{background:#1d343d;color:#b6cdce}
    .pager button[aria-pressed=true]{border-color:var(--teal)}
    .wide-count{display:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .app.expanded{max-width:none}.app.expanded .topbar{display:none}.app.expanded{grid-template-rows:minmax(0,1fr) auto;padding-top:.55rem}
    @media(min-width:650px){.wide-count{display:inline}.slide-title{font-size:5.2cqw}}
    @media(max-width:520px){.pager{grid-template-columns:auto auto 1fr}.pager button{padding-inline:.48em}.pager .step-buttons{gap:4px}.pager .actions{gap:4px}}
    @media(max-height:390px){.topbar{padding:0}.pager{padding:0 0 .22rem}.pager button{min-height:28px}.app{gap:4px}}
  </style>
</head>
<body>
<div class="app" id="presentation">
  <header class="topbar">
    <a href="index.html">CM知識一覧へ</a>
    <strong>排煙</strong>
    <a href="smoke-control-report.html">詳細レポート</a>
  </header>
  <main class="stage-space">
    <div class="stage" aria-label="排煙スライド">
      <section class="slide cover" id="s1" aria-labelledby="title-1">
        <div>
          <span class="topic">建設CMの基礎</span>
          <h1 id="title-1">煙はどこへ<br>行く？</h1>
          <p class="intro">建物の断面で見る排煙</p>
        </div>
        <figure class="figure">
          <canvas width="800" height="400" data-scene="0" aria-label="室内で発生した煙が立ち上る建物断面" role="img">室内で発生した煙が立ち上ります。</canvas>
          <figcaption>機械排煙の模式例</figcaption>
        </figure>
      </section>
      <section class="slide" id="s2" aria-labelledby="title-2" hidden>
        <header><span class="topic">煙の動き</span><h2 class="slide-title" id="title-2">煙は天井付近に広がる</h2></header>
        <figure class="figure">
          <canvas width="800" height="400" data-scene="1" aria-label="室内の煙が上昇し、天井に沿って横に広がる様子" role="img">熱い煙が天井まで上がり、横に広がります。</canvas>
        </figure>
      </section>
      <section class="slide phase-3" id="s3" aria-labelledby="title-3" hidden>
        <header><span class="topic">排煙</span><h2 class="slide-title" id="title-3">煙を排煙口から外へ出す</h2></header>
        <figure class="figure">
          <canvas width="800" height="400" data-scene="2" aria-label="天井の排煙口から、ダクトと排煙機を通って煙が屋外へ出る様子" role="img">煙は排煙口からダクトと排煙機を通って屋外へ出ます。</canvas>
          <figcaption>橙の矢印が煙の出口を示します</figcaption>
        </figure>
      </section>
      <section class="slide phase-4" id="s4" aria-labelledby="title-4" hidden>
        <header><span class="topic">給気</span><h2 class="slide-title" id="title-4">別の経路から空気を補う</h2></header>
        <figure class="figure">
          <canvas width="800" height="400" data-scene="3" aria-label="煙を出す経路とは別に、室の低い位置から外気を補う例" role="img">図の例では、外気が室の低い位置から入ります。</canvas>
          <figcaption>青の矢印が入ってくる空気を示します</figcaption>
        </figure>
      </section>
      <section class="slide video-slide" id="s5" aria-labelledby="title-5" hidden>
        <h2 class="sr-only" id="title-5">26秒の動画で排煙と給気の流れを見る</h2>
        <video id="clip" controls playsinline preload="none" poster="smoke-control-video-poster.png" aria-label="排煙と給気の26秒解説。日本語音声と字幕付き">
          <source src="smoke-control-video.mp4" type="video/mp4">
          <track kind="captions" srclang="ja" label="日本語" src="smoke-control-video-ja.vtt">
          <a href="smoke-control-video.mp4">26秒の動画を開く</a>
        </video>
      </section>
      <section class="slide check" id="s6" aria-labelledby="title-6" hidden>
        <header><span class="topic">発注者の確認</span><h2 class="slide-title" id="title-6">図面で出入りの経路を追う</h2></header>
        <div class="check-layout">
          <figure class="figure">
            <canvas width="800" height="400" data-scene="5" aria-label="発注者が見る位置を番号で示した断面。1は排煙口、2は屋外への経路、3は給気の経路" role="img">数字は右の一覧に対応しています。</canvas>
          </figure>
          <ol class="route-list">
            <li><strong>1</strong>排煙口</li>
            <li><strong>2</strong>屋外への経路</li>
            <li><strong>3</strong>給気の経路</li>
          </ol>
        </div>
      </section>
    </div>
  </main>
  <nav class="pager" aria-label="スライド操作">
    <span class="position" id="count" aria-live="polite">1 / 6</span>
    <div class="step-buttons">
      <button id="previous" type="button" aria-label="前のスライド">← 前</button>
      <button id="next" type="button" aria-label="次のスライド">次 →</button>
    </div>
    <div class="actions">
      <button id="motion" type="button" aria-pressed="true">動き</button>
      <button id="fullscreen" type="button" aria-pressed="false">全画面</button>
    </div>
  </nav>
</div>
<script>
  'use strict';
  const deck = document.querySelector('#presentation');
  const pages = [...document.querySelectorAll('.slide')];
  const clip = document.querySelector('#clip');
  const count = document.querySelector('#count');
  const prev = document.querySelector('#previous');
  const next = document.querySelector('#next');
  const full = document.querySelector('#fullscreen');
  const motion = document.querySelector('#motion');
  const colors = {
    navy:'#244458',wall:'#f6dfac',floor:'#d5bd88',side:'#e5ca96',roof:'#809bab',
    smoke:'#697782',orange:'#ad4c24',blue:'#0078aa',paper:'#fffaf0',teal:'#005e63'
  };
  let index = 0;
  let moving = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = performance.now();
  let animation = 0;

  function polygon(ctx, points, fill, stroke, thickness=3) {
    ctx.beginPath();
    points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    if(stroke){ctx.lineWidth=thickness;ctx.strokeStyle=stroke;ctx.stroke();}
  }
  function line(ctx, points, color, width=4) {
    ctx.beginPath(); ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=color;
    points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
    ctx.stroke();
  }
  function dot(ctx,x,y,r,fill,stroke) {
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke();}
  }
  function box(ctx,x,y,w,h,fill,stroke,r=8) {
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();}
  }
  function label(ctx,text,x,y,fill,size=24) {
    ctx.font='800 '+size+'px "Yu Gothic UI", Meiryo, sans-serif';
    ctx.textBaseline='middle';ctx.fillStyle=fill;ctx.fillText(text,x,y);
  }
  function arrow(ctx,points,color,t,active=true) {
    line(ctx,points,color,active?8:5);
    const [x,y]=points.at(-1),[ax,ay]=points.at(-2);
    const angle=Math.atan2(y-ay,x-ax);
    polygon(ctx,[[x+9*Math.cos(angle),y+9*Math.sin(angle)],[x-18*Math.cos(angle-.52),y-18*Math.sin(angle-.52)],[x-18*Math.cos(angle+.52),y-18*Math.sin(angle+.52)]],color);
    if(!active)return;
    const segments=points.slice(1).map((p,i)=>[points[i],p,Math.hypot(p[0]-points[i][0],p[1]-points[i][1])]);
    const length=segments.reduce((sum,p)=>sum+p[2],0);
    for(let i=0;i<4;i++){
      let offset=((t*.55+i/4)%1)*length;
      for(const [a,b,len] of segments){
        if(offset<=len){dot(ctx,a[0]+(b[0]-a[0])*offset/len,a[1]+(b[1]-a[1])*offset/len,4.5,'#ffe9b9');break;}
        offset-=len;
      }
    }
  }
  function room(ctx) {
    const c=colors;
    polygon(ctx,[[74,335],[654,335],[740,376],[136,376]],'#ecdbb5');
    polygon(ctx,[[118,140],[630,140],[630,332],[118,332]],c.wall,c.navy);
    polygon(ctx,[[630,140],[696,104],[696,294],[630,332]],c.side,c.navy);
    polygon(ctx,[[118,332],[630,332],[696,294],[183,294]],c.floor,c.navy);
    polygon(ctx,[[110,136],[637,136],[704,99],[177,99]],'#b6cbd1',c.navy);
    polygon(ctx,[[110,136],[637,136],[637,152],[110,152]],c.roof,c.navy);
    polygon(ctx,[[637,136],[704,99],[704,115],[637,152]],'#a3bcbf',c.navy);
    box(ctx,144,192,49,102,'#d5e8ca',c.navy,5);
    line(ctx,[[169,193],[169,292]],'#7c9b8b',3);
    box(ctx,263,260,83,38,'#e6b46f',c.navy,5);
    line(ctx,[[271,298],[270,310]],c.navy,4);line(ctx,[[337,298],[340,310]],c.navy,4);
    box(ctx,218,310,33,10,'#8b5d4a',null,4);
    box(ctx,477,150,53,13,'#e6eee3',c.navy,4);
    for(let x=485;x<526;x+=9)line(ctx,[[x,154],[x,160]],c.navy,2);
    line(ctx,[[505,151],[505,78],[674,78],[674,58]],c.navy,22);
    line(ctx,[[505,151],[505,78],[674,78],[674,58]],'#a7c7cc',15);
    box(ctx,557,58,51,40,'#a8c9c7',c.navy,6);
    dot(ctx,583,78,12,'#e8efdb',c.navy);
    box(ctx,631,289,48,13,'#99c4ce',c.navy,4);
  }
  function smoke(ctx,t,layer) {
    for(let n=0;n<13;n++){
      const rise=(t*.58+n/13)%1;
      const x=233+Math.sin(n*.91+rise*7)*13*rise+rise**3*37;
      const y=309-rise*147;
      const r=6+rise*12;
      ctx.globalAlpha=.34*(1-rise*.58);
      ctx.fillStyle=colors.smoke;ctx.beginPath();ctx.ellipse(x,y,r,r*.72,0,0,6.2832);ctx.fill();
    }
    if(layer){
      const growth=moving ? Math.min(1,t/1.7+.3) : 1;
      for(let n=0;n<14;n++){
        const x=247+n*23*growth,y=169+3*Math.sin(n+t);
        ctx.globalAlpha=.18;ctx.fillStyle=colors.smoke;ctx.beginPath();ctx.ellipse(x,y,21+n%4*2,12,0,0,6.2832);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  function marker(ctx,x,y,n,active){
    dot(ctx,x,y,active?16:13,'#ffd27c',colors.navy);
    label(ctx,String(n),x-6,y,colors.navy,20);
  }
  function paint(canvas,t) {
    const scene=Number(canvas.dataset.scene);
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    box(ctx,6,6,788,388,colors.paper,'#d8caac',27);
    room(ctx);
    smoke(ctx,t,scene>0);
    if(scene===1){
      arrow(ctx,[[250,285],[252,193]],'#4e6870',t);
      arrow(ctx,[[272,180],[424,180]],'#4e6870',t);
    }
    if(scene>=2){
      arrow(ctx,[[388,175],[483,175],[505,155],[505,78],[674,78],[674,37]],
        scene===3?'#c48162':colors.orange,t,scene!==3);
      if(scene===2)label(ctx,'屋外へ',700,52,colors.orange,24);
    }
    if(scene>=3){
      arrow(ctx,[[754,295],[654,295],[462,295]],colors.blue,t);
      if(scene===3)label(ctx,'空気',709,328,colors.blue,24);
    }
    if(scene===5){
      const active=Math.floor(t/.92)%3;
      [[511,156],[677,76],[640,294]].forEach(([x,y],i)=>marker(ctx,x,y,i+1,i===active));
    }
  }
  function repaint(now) {
    const canvas=pages[index].querySelector('canvas');
    if(!canvas)return;
    paint(canvas,moving ? ((now-started)/1000)%12 : 2.8);
    if(moving)animation=requestAnimationFrame(repaint);
  }
  function refreshMotion() {
    motion.setAttribute('aria-pressed',String(moving));
    motion.textContent=moving?'動き：入':'動き：切';
    cancelAnimationFrame(animation);
    animation=requestAnimationFrame(repaint);
  }
  function show(requested,writeHash=true) {
    const target=Math.max(0,Math.min(pages.length-1,requested));
    if(index===4 && target!==4)clip.pause();
    index=target;
    pages.forEach((slide,i)=>{slide.hidden=i!==index;});
    count.textContent=(index+1)+' / '+pages.length;
    prev.disabled=index===0;next.disabled=index===pages.length-1;
    motion.disabled=index===4;
    if(writeHash&&location.hash!=='#s'+(index+1))history.replaceState(null,'','#s'+(index+1));
    started=performance.now();
    refreshMotion();
  }
  function fromHash() {
    const match=/^#s(\d+)$/.exec(location.hash);
    show(match?Number(match[1])-1:0);
  }
  prev.addEventListener('click',()=>show(index-1));
  next.addEventListener('click',()=>show(index+1));
  motion.addEventListener('click',()=>{moving=!moving;refreshMotion();});
  window.addEventListener('hashchange',fromHash);
  function setFull(enabled) {
    deck.classList.toggle('expanded',enabled);
    full.setAttribute('aria-pressed',String(enabled));
    full.textContent=enabled?'元に戻す':'全画面';
  }
  full.addEventListener('click',async()=>{
    if(deck.classList.contains('expanded')){
      if(document.fullscreenElement===deck)await document.exitFullscreen().catch(()=>{});
      setFull(false);return;
    }
    setFull(true);
    if(deck.requestFullscreen)await deck.requestFullscreen().catch(()=>{});
  });
  document.addEventListener('fullscreenchange',()=>{
    if(document.fullscreenElement===deck)setFull(true);
    else if(!document.fullscreenElement)setFull(false);
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!document.fullscreenElement)setFull(false);
    if(event.target.closest('video,input,select,textarea')||event.altKey||event.ctrlKey||event.metaKey)return;
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
      event.preventDefault();show(index+(event.key==='ArrowRight'?1:-1));
    }
  });
  fromHash();
</script>
</body>
</html>
