<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>防火設備｜3分動画とレポート</title><style>:root{color-scheme:dark;--bg:#0a1220;--ink:#edf4ff;--sub:#adbed4;--line:#304159;--panel:#142237;--accent:#8ee1d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Inter,"Yu Gothic UI",Meiryo,sans-serif}header,main,footer{max-width:1160px;margin:auto;padding:22px}nav{display:flex;flex-wrap:wrap;gap:24px}a{color:var(--accent);text-underline-offset:4px}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.35;margin:8px 0 12px}p{color:var(--sub)}.stage{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:16/9}video{display:block;width:100%;height:100%;object-fit:contain}video::cue{background:rgba(5,12,22,.88);color:#fff;font:18px Meiryo,sans-serif}.stage:fullscreen{border:0;border-radius:0;width:100%;height:100%;aspect-ratio:auto}.controls{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px}button{cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}select{margin-left:8px}.chapters{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0}.chapters button{font-size:.95rem}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #efbe77;outline-offset:3px}#status{min-height:1.8em;margin:0}.report-link{font-size:1.1rem}footer{border-top:1px solid var(--line)}@media(max-width:560px){header,main,footer{padding:16px}.controls{gap:10px}.controls label{display:flex;align-items:center}.chapters button{font-size:.9rem;padding:7px 10px}}</style></head><body><header><nav><a href="index.html">CM知識一覧</a><a href="fire-safety-cm-report.html">詳細レポートを読む</a></nav></header><main><h1>防火設備</h1><p>架空のホテル案件で、CMが確認する順序を学びます。</p><div id="stage" class="stage"><video controls playsinline muted preload="metadata" src="fire-safety-cm-film-haruka.mp4" poster="fire-safety-cm-film-poster.png"><track kind="captions" srclang="ja" label="日本語" src="fire-safety-cm-film-ja.vtt" default></video></div><div class="controls"><button id="audio" type="button" aria-pressed="false">音声 OFF</button><label>音声<select id="voice"><option value="haruka" data-src="fire-safety-cm-film-haruka.mp4">Microsoft Haruka</option><option value="ayumi" data-src="fire-safety-cm-film-ayumi.mp4">Microsoft Ayumi</option></select></label><label>速度<select id="rate"><option value=".75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></label><button id="captions" type="button" aria-pressed="true">字幕 ON</button><button id="fullscreen" type="button">全画面</button></div><p id="status" role="status"></p><nav class="chapters" aria-label="動画の章"><button type="button" data-time="0">1　相談</button><button type="button" data-time="18">2　20分と1時間</button><button type="button" data-time="36">3　区画と遮煙</button><button type="button" data-time="54">4　閉鎖のしくみ</button><button type="button" data-time="72">5　避難の安全</button><button type="button" data-time="90">6　設計</button><button type="button" data-time="108">7　発注</button><button type="button" data-time="126">8　施工</button><button type="button" data-time="144">9　連動試験</button><button type="button" data-time="162">10　引渡しの証拠</button></nav><p class="report-link"><a href="fire-safety-cm-report.html">根拠・数値・比較表をレポートで確認する</a></p></main><footer>CM知識一覧</footer><script>const video=document.querySelector('video'),voice=document.getElementById('voice'),rate=document.getElementById('rate'),audio=document.getElementById('audio'),captions=document.getElementById('captions'),status=document.getElementById('status');
let audible=false,showCaptions=true,revision=0,loading=false,lastTime=0,resumeAfterLoad=false;
function updateCaptions(){for(const track of video.textTracks)track.mode=showCaptions?'showing':'hidden';captions.textContent=showCaptions?'字幕 ON':'字幕 OFF';captions.setAttribute('aria-pressed',String(showCaptions));}
function updateAudio(){video.muted=!audible;audio.textContent=audible?'音声 ON':'音声 OFF';audio.setAttribute('aria-pressed',String(audible));}
video.addEventListener('timeupdate',()=>{if(!loading)lastTime=video.currentTime;});
video.addEventListener('loadedmetadata',()=>{video.playbackRate=Number(rate.value);updateAudio();updateCaptions();});
document.querySelector('track').addEventListener('load',updateCaptions);
video.addEventListener('error',()=>{status.textContent='動画を読み込めませんでした。ページを再読み込みしてください。';});
audio.addEventListener('click',()=>{audible=!audible;updateAudio();});
captions.addEventListener('click',()=>{showCaptions=!showCaptions;updateCaptions();});
rate.addEventListener('change',()=>{video.playbackRate=Number(rate.value);});
voice.addEventListener('change',()=>{const id=++revision;lastTime=loading?lastTime:video.currentTime;resumeAfterLoad=loading?resumeAfterLoad:!video.paused;loading=true;status.textContent='音声を切り替えています';video.addEventListener('loadedmetadata',()=>{if(id!==revision)return;video.currentTime=Math.min(lastTime,Math.max(0,video.duration-.01));loading=false;status.textContent='';if(resumeAfterLoad)video.play().catch(()=>{status.textContent='再生ボタンを押してください。';});},{once:true});video.src=voice.selectedOptions[0].dataset.src;video.load();});
function leaveFullscreen(){document.body.classList.remove('fullscreen-fallback');if(document.fullscreenElement)document.exitFullscreen();}document.getElementById('fullscreen').addEventListener('click',()=>{const stage=document.getElementById('stage');if(document.fullscreenElement||document.body.classList.contains('fullscreen-fallback'))leaveFullscreen();else if(stage.requestFullscreen)stage.requestFullscreen().catch(()=>{document.body.classList.add('fullscreen-fallback');});else document.body.classList.add('fullscreen-fallback');});document.addEventListener('keydown',event=>{if(event.key==='Escape')leaveFullscreen();});
const fullStyle=document.createElement('style');fullStyle.textContent='body.fullscreen-fallback{overflow:hidden}body.fullscreen-fallback .stage{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0;z-index:10000}.stage{position:relative}.exit-fullscreen{display:none;position:absolute;right:16px;top:16px;z-index:2;background:#142237ee}body.fullscreen-fallback .exit-fullscreen,.stage:fullscreen .exit-fullscreen{display:block}';document.head.appendChild(fullStyle);const exitFull=document.createElement('button');exitFull.type='button';exitFull.className='exit-fullscreen';exitFull.textContent='画面を戻す';exitFull.addEventListener('click',leaveFullscreen);document.getElementById('stage').appendChild(exitFull);
for(const button of document.querySelectorAll('[data-time]'))button.addEventListener('click',()=>{const seek=Number(button.dataset.time);lastTime=seek;if(video.readyState)video.currentTime=seek;else video.addEventListener('loadedmetadata',()=>{video.currentTime=seek;},{once:true});});
updateAudio();</script></body></html>
